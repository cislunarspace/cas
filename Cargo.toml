[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/expr",
    "crates/poly",
    "crates/print",
    "crates/parse",
    "crates/cas",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
num-bigint = "0.4"
num-integer = "0.1"
proptest = "1"
cas-domain = { path = "crates/domain" }
cas-expr = { path = "crates/expr" }
cas-poly = { path = "crates/poly" }
cas-print = { path = "crates/print" }
cas-parse = { path = "crates/parse" }
cas = { path = "crates/cas" }
