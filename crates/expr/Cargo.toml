[package]
name = "cas-expr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cas-expr: Expression arena, hash-consing, canonical form construction, and ordering for symcas"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
cas-domain = { workspace = true }
cas-poly = { workspace = true }
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
# 自引用：为集成测试启用 test-gen 特性（语料生成器不进默认依赖图）。
# 不写 version：打包发布时 Cargo 会剔除无版本号的 dev-dependency，避免自引用上架前无法解析。
cas-expr = { path = ".", features = ["test-gen"] }

[features]
test-gen = ["dep:proptest"]
